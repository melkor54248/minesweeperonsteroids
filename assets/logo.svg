<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title description">
  <title id="title">Minesweeper on Steroids - Neon Edition</title>
  <desc id="description">Original cyan mine and gold lightning emblem beside the Minesweeper on Steroids wordmark. Classic deduction. Extra firepower. Zero mercy.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="0.6">
      <stop stop-color="#142637"/>
      <stop offset="1" stop-color="#090f1c"/>
    </linearGradient>
    <linearGradient id="tile" x2=".8" y2="1">
      <stop stop-color="#243f58"/>
      <stop offset="1" stop-color="#0b1321"/>
    </linearGradient>
    <radialGradient id="core" cx=".34" cy=".26" r=".85">
      <stop stop-color="#345c72"/>
      <stop offset="1" stop-color="#0d1e30"/>
    </radialGradient>
    <linearGradient id="gold" x2=".7" y2="1">
      <stop stop-color="#fff1b1"/>
      <stop offset="1" stop-color="#ffb940"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="27" height="27" rx="4" fill="none" stroke="#4eeeda" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="1276" height="336" rx="28" fill="url(#background)" stroke="#35526b" stroke-width="2"/>
  <rect x="20" y="20" width="1240" height="300" rx="20" fill="url(#grid)"/>
  <path d="M330 285H1220" stroke="#4eeeda" stroke-width="2" opacity=".22"/>
  <g transform="translate(36 41)">
    <rect x="7" y="7" width="242" height="242" rx="53" fill="#060c16"/>
    <rect x="10" y="8" width="236" height="236" rx="49" fill="url(#tile)" stroke="#40617c" stroke-width="3"/>
    <path d="M37 50Q39 29 62 29H194" fill="none" stroke="#7194ad" stroke-width="3" opacity=".5"/>
    <circle cx="128" cy="130" r="85" fill="none" stroke="#4eeeda" stroke-width="10" opacity=".08"/>
    <circle cx="128" cy="130" r="76" fill="none" stroke="#4eeeda" stroke-width="2" opacity=".3"/>
    <g stroke="#4eeeda" stroke-width="11" stroke-linecap="round">
      <path d="M128 43V65M128 195V217M41 130H63M193 130H215"/>
      <path d="M66 68L82 84M174 176L190 192M66 192L82 176M174 84L190 68"/>
    </g>
    <circle cx="128" cy="130" r="59" fill="url(#core)" stroke="#4eeeda" stroke-width="6"/>
    <path d="M91 111A43 43 0 0 1 124 88" fill="none" stroke="#bafbf2" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    <path d="M143 63L98 139H125L111 198L169 113H138L155 63Z" fill="#07111d" stroke="#07111d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M143 63L98 139H125L111 198L169 113H138L155 63Z" fill="url(#gold)" stroke="#ffe0a0" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="329" y="76" fill="#4eeeda" font-size="18" font-weight="700" letter-spacing="5">NEON EDITION / WINDOWS DESKTOP</text>
    <text x="324" y="165" fill="#eafffb" font-size="82" font-weight="800" letter-spacing="-2">MINESWEEPER</text>
    <rect x="330" y="189" width="314" height="47" rx="9" fill="url(#gold)"/>
    <text x="351" y="222" fill="#23190e" font-size="29" font-weight="800" letter-spacing="3">ON STEROIDS</text>
    <text x="331" y="268" fill="#a2b8cc" font-size="22">Classic deduction. Extra firepower. Zero mercy.</text>
  </g>
